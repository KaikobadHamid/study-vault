<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cliffs TOEFL</title>
  <style>
    :root {
      --bg-color: #f0f7ff;
      --container-bg: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e0f2fe;
      --card-bg: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
      --card-border: #bae6fd;
      --form-bg: #f8fafc;
      --form-border: #e2e8f0;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-text: #0f172a;
      --th-bg: #e0f2fe;
      --th-color: #0369a1;
      --th-border: #bae6fd;
      --tr-border: #f1f5f9;
      --tr-hover: #f8fafc;
      --completed-bg: #f0fdf4;
      --completed-text: #94a3b8;
      --primary-accent: #0284c7;
      --primary-accent-hover: #0369a1;
      --primary-heading: #0369a1;
      --track-bg: #cbd5e1;
      --toggle-bg: #e2e8f0;
    }

    [data-theme="dark"] {
      --bg-color: #0b132b;
      --container-bg: #1c2541;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #2a3a5e;
      --card-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      --card-border: #0284c7;
      --form-bg: #0f172a;
      --form-border: #334155;
      --input-bg: #1e293b;
      --input-border: #475569;
      --input-text: #f8fafc;
      --th-bg: #0f172a;
      --th-color: #38bdf8;
      --th-border: #1e293b;
      --tr-border: #334155;
      --tr-hover: #243256;
      --completed-bg: #064e3b22;
      --completed-text: #64748b;
      --primary-accent: #38bdf8;
      --primary-accent-hover: #0284c7;
      --primary-heading: #38bdf8;
      --track-bg: #334155;
      --toggle-bg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 24px;
      display: flex;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--container-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 32px;
      border: 1px solid var(--border-color);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    h1 {
      color: var(--primary-heading);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-control {
      background: var(--toggle-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      border-color: var(--primary-accent);
    }

    .btn-lock.locked {
      background-color: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }

    [data-theme="dark"] .btn-lock.locked {
      background-color: #7f1d1d44;
      color: #fca5a5;
      border-color: #991b1b;
    }

    .btn-lock.unlocked {
      background-color: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }

    [data-theme="dark"] .btn-lock.unlocked {
      background-color: #14532d44;
      color: #86efac;
      border-color: #166534;
    }

    /* Water Flow Progress Bar */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 32px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .chart-title {
      font-weight: bold;
      color: var(--primary-heading);
      font-size: 16px;
    }

    .chart-stats {
      font-weight: bold;
      color: var(--primary-accent);
      font-size: 16px;
    }

    .bar-container {
      width: 100%;
      height: 28px;
      background-color: var(--track-bg);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        -45deg,
        #0284c7,
        #38bdf8,
        #0284c7,
        #0369a1,
        #38bdf8
      );
      background-size: 300% 300%;
      animation: waterFlow 4s ease infinite;
      border-radius: 14px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .bar-fill::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 10%, transparent 20%);
      background-size: 12px 12px;
      opacity: 0.3;
      animation: bubbles 3s linear infinite;
    }

    @keyframes waterFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes bubbles {
      0% { background-position: 0 0; }
      100% { background-position: 0 -24px; }
    }

    /* Input Form Section */
    .form-card {
      background: var(--form-bg);
      border: 1px solid var(--form-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 32px;
      transition: all 0.3s ease;
    }

    .form-card.hidden {
      display: none;
    }

    .form-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--text-primary);
      margin-bottom: 14px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 120px 1fr 180px auto;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      color: var(--input-text);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
    }

    .btn-add {
      background-color: var(--primary-accent);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: var(--primary-accent-hover);
    }

    /* Topics Table */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: var(--th-bg);
      color: var(--th-color);
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 2px solid var(--th-border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--tr-border);
      font-size: 14px;
    }

    tr:hover {
      background-color: var(--tr-hover);
    }

    .completed-row td:not(:first-child) {
      opacity: 0.6;
    }

    .topic-link {
      color: var(--primary-heading);
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s ease;
    }

    .topic-link:hover {
      color: var(--primary-accent);
      text-decoration: underline;
    }

    .completed-row .topic-link {
      text-decoration: line-through;
    }

    .checkbox-custom {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-accent);
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-delete:hover {
      background-color: rgba(239, 68, 68, 0.15);
    }

    .action-col-hidden {
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-secondary);
      font-style: italic;
    }

    @media (max-width: 640px) {
      .input-grid {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Cliffs TOEFL</h1>
        <p class="subtitle">Preparation Tracker & Notes Directory</p>
      </div>
      <div class="header-controls">
        <button class="btn-control btn-lock locked" id="lockBtn" onclick="toggleLock()">
          <span id="lockIcon">🔒</span> <span id="lockLabel">Locked</span>
        </button>
        <button class="btn-control" id="themeToggleBtn" onclick="toggleTheme()">
          <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
        </button>
      </div>
    </header>

    <!-- Water Flow Horizontal Bar Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Overall Completion</span>
        <span class="chart-stats" id="completionText">0% (0/0)</span>
      </div>
      <div class="bar-container">
        <div class="bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Add Topic Input Form (Hidden in Locked Mode) -->
    <div class="form-card hidden" id="formCard">
      <div class="form-title">Add New Topic Note</div>
      <form id="topicForm">
        <div class="input-grid">
          <input type="text" id="topicNo" placeholder="Topic No (e.g. 01)" required />
          <input type="text" id="topicName" placeholder="Topic Name (e.g. Subject-Verb)" required />
          <input type="text" id="topicFile" placeholder="File Link (e.g. notes/topic-01.html)" />
          <button type="submit" class="btn-add">Add Topic</button>
        </div>
      </form>
    </div>

    <!-- Topics Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Done</th>
            <th style="width: 120px;">Topic No</th>
            <th>Topic Name (Click to Open Note)</th>
            <th class="action-col-header action-col-hidden" style="width: 60px;">Action</th>
          </tr>
        </thead>
        <tbody id="topicsTableBody">
          <!-- Rendered via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "cliffs_toefl_topics_v4";
    const THEME_KEY = "cliffs_toefl_theme";
    const PASSCODE_KEY = "cliffs_toefl_passcode";

    const defaultTopics = [
      { id: "1", no: "Topic 01", name: "Subject-Verb Agreement", file: "notes/topic-01.html", completed: false },
      { id: "2", no: "Topic 02", name: "Pronoun Antecedent & Case", file: "notes/topic-02.html", completed: false },
      { id: "3", no: "Topic 03", name: "Misplaced & Dangling Modifiers", file: "notes/topic-03.html", completed: false },
      { id: "4", no: "Topic 04", name: "Parallel Structure", file: "notes/topic-04.html", completed: false }
    ];

    let topics = [];
    let isLocked = true;
    let passcode = "kaikobadisbest";

    // Passcode Logic
    function initPasscode() {
      localStorage.setItem(PASSCODE_KEY, passcode);
    }

    function toggleLock() {
      if (isLocked) {
        const input = prompt("Enter passcode to unlock Edit Mode:");
        if (input === passcode) {
          isLocked = false;
          alert("Unlocked! Edit mode activated.");
        } else if (input !== null) {
          alert("Incorrect passcode!");
        }
      } else {
        isLocked = true;
      }
      updateLockUI();
    }

    function updateLockUI() {
      const lockBtn = document.getElementById("lockBtn");
      const lockIcon = document.getElementById("lockIcon");
      const lockLabel = document.getElementById("lockLabel");
      const formCard = document.getElementById("formCard");
      const actionHeader = document.querySelector(".action-col-header");

      if (isLocked) {
        lockBtn.className = "btn-control btn-lock locked";
        lockIcon.textContent = "🔒";
        lockLabel.textContent = "Locked";
        formCard.classList.add("hidden");
        if (actionHeader) actionHeader.classList.add("action-col-hidden");
      } else {
        lockBtn.className = "btn-control btn-lock unlocked";
        lockIcon.textContent = "🔓";
        lockLabel.textContent = "Unlocked Mode";
        formCard.classList.remove("hidden");
        if (actionHeader) actionHeader.classList.remove("action-col-hidden");
      }
      updateUI();
    }

    // Theme Switch
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";
      applyTheme(newTheme);
      localStorage.setItem(THEME_KEY, newTheme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const themeIcon = document.getElementById("themeIcon");
      const themeLabel = document.getElementById("themeLabel");
      if (theme === "dark") {
        themeIcon.textContent = "☀️";
        themeLabel.textContent = "Light Mode";
      } else {
        themeIcon.textContent = "🌙";
        themeLabel.textContent = "Dark Mode";
      }
    }

    // Data handling
    function loadTopics() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          topics = JSON.parse(stored);
        } catch (e) {
          topics = [...defaultTopics];
        }
      } else {
        topics = [...defaultTopics];
        saveTopics();
      }
    }

    function saveTopics() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
      updateUI();
    }

    function updateUI() {
      const total = topics.length;
      const completedCount = topics.filter(t => t.completed).length;
      const percentage = total === 0 ? 0 : Math.round((completedCount / total) * 100);

      const progressBar = document.getElementById("progressBar");
      const completionText = document.getElementById("completionText");
      
      progressBar.style.width = percentage + "%";
      completionText.textContent = `${percentage}% (${completedCount}/${total})`;

      const tbody = document.getElementById("topicsTableBody");
      tbody.innerHTML = "";

      if (total === 0) {
        tbody.innerHTML = `<tr><td colspan="${isLocked ? 3 : 4}" class="empty-state">No topics available. Unlock to add.</td></tr>`;
        return;
      }

      topics.forEach((topic) => {
        const tr = document.createElement("tr");
        if (topic.completed) {
          tr.classList.add("completed-row");
        }

        const filePath = topic.file ? topic.file : `#`;

        tr.innerHTML = `
          <td style="text-align: center;">
            <input type="checkbox" class="checkbox-custom" ${topic.completed ? "checked" : ""} onchange="toggleComplete('${topic.id}')" />
          </td>
          <td><strong>${escapeHtml(topic.no)}</strong></td>
          <td>
            <a href="${escapeHtml(filePath)}" class="topic-link">${escapeHtml(topic.name)}</a>
          </td>
          ${!isLocked ? `
          <td>
            <button class="btn-delete" onclick="deleteTopic('${topic.id}')" title="Delete Topic">✕</button>
          </td>` : ''}
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleComplete(id) {
      topics = topics.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTopics();
    }

    document.getElementById("topicForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const noInput = document.getElementById("topicNo");
      const nameInput = document.getElementById("topicName");
      const fileInput = document.getElementById("topicFile");

      let fileVal = fileInput.value.trim();
      if (!fileVal) {
        const cleanNo = noInput.value.trim().toLowerCase().replace(/\s+/g, '-');
        fileVal = `notes/${cleanNo}.html`;
      }

      const newTopic = {
        id: Date.now().toString(),
        no: noInput.value.trim(),
        name: nameInput.value.trim(),
        file: fileVal,
        completed: false
      };

      topics.push(newTopic);
      saveTopics();

      noInput.value = "";
      nameInput.value = "";
      fileInput.value = "";
    });

    function deleteTopic(id) {
      if (confirm("Are you sure you want to delete this topic?")) {
        topics = topics.filter(t => t.id !== id);
        saveTopics();
      }
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // Initialization
    initPasscode();
    initTheme();
    loadTopics();
    updateLockUI();
  </script>
</body>
</html>
